name: nurture
description: Pregnancy and newborn monitoring for our family. Fully offline, private.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  freezed_annotation: ^2.4.4
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.1.0
  timezone: ^0.10.0
  local_auth: ^2.3.0
  fl_chart: ^0.70.2
  file_picker: ^8.3.3
  path_provider: ^2.1.5
  encrypt: ^5.0.3
  crypto: ^3.0.6
  intl: ^0.19.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  freezed: ^2.5.8

flutter:
  uses-material-design: true
  assets:
    - assets/content/
